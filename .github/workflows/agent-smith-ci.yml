name: Agent Smith P1

on:
  pull_request:
    branches: [main]
  push:
    # Candidate refs allow exact-commit checks before protected main is created.
    branches: [main, 'p1/**', 'task/**']
  # Maintainer re-run of the same exact-ref checks without a new commit (write access required).
  # Main source provenance stays push-to-main only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-smith-p1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Preserve the committed bytes on Windows too; native source hashes are byte hashes.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  GIT_NO_REPLACE_OBJECTS: '1'

jobs:
  secrets:
    name: Gitleaks 8.30.1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Provision verified Gitleaks CLI
        shell: pwsh
        run: ./scripts/agent-smith-ci-tools.ps1 -Tool gitleaks
      - uses: ./.github/actions/agent-smith-bun
      - name: Verify source head and current fast-forward target
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor 717f97f4d22b3d65c4a4eef6a744255d46f4d1a6 "$SOURCE_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --no-recurse-submodules "https://github.com/${GITHUB_REPOSITORY}.git" '+refs/heads/main:refs/remotes/smith-target/main'
            target_base=$(git rev-parse refs/remotes/smith-target/main)
            git merge-base --is-ancestor "$target_base" "$SOURCE_SHA"
            printf 'target-base=%s\n' "$target_base" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan immutable history, historical stored blobs and source tree
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_BASE: ${{ steps.source.outputs.target-base }}
        run: |
          set -euo pipefail
          args=(--candidate "$SOURCE_SHA" --output "$RUNNER_TEMP/agent-smith-scan")
          if [ -n "$TARGET_BASE" ]; then args+=(--target-base "$TARGET_BASE"); fi
          bun --no-env-file run smith:scan -- "${args[@]}"
      - name: Retain redacted scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-smith-scan-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/agent-smith-scan/
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: Development (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: win32-x64
          - os: macos-15
            target: darwin-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/agent-smith-bun
      - name: Verify source head and current fast-forward target
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor 717f97f4d22b3d65c4a4eef6a744255d46f4d1a6 "$SOURCE_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --no-recurse-submodules "https://github.com/${GITHUB_REPOSITORY}.git" '+refs/heads/main:refs/remotes/smith-target/main'
            target_base=$(git rev-parse refs/remotes/smith-target/main)
            git merge-base --is-ancestor "$target_base" "$SOURCE_SHA"
          fi
      - name: Provision Linux sandbox test dependency (runner only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          /usr/bin/bwrap --version
          sha256sum /usr/bin/bwrap
      - name: Permit bwrap user namespaces (Linux CI runner only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo aa-status --enabled
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          profile=/etc/apparmor.d/agent-smith-ci-bwrap
          test ! -e "$profile" && test ! -L "$profile"
          sudo install --mode=0644 /dev/stdin "$profile" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile agent-smith-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --add --skip-cache "$profile"
          sudo aa-status --enabled
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Provision pinned source-native toolchain (runner only)
        env:
          RUSTUP_HOME: ${{ runner.temp }}/agent-smith-rustup
          CARGO_HOME: ${{ runner.temp }}/agent-smith-cargo-bootstrap
        run: |
          set -euo pipefail
          command -v rustup
          command -v cmake
          command -v ninja
          rustup toolchain install nightly-2026-08-12 --profile minimal --no-self-update
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Install frozen dependencies, build and load native addon, generate assets
        run: bun --no-env-file run smith:prepare
      - name: Static checks and maintained subprocess contracts
        run: bun --no-env-file run smith:check
      - name: Source CLI synthetic state and worker smoke
        run: bun --no-env-file run smith:smoke
      - name: Compile, package, unpack, and smoke development artifact
        run: bun --no-env-file run smith:build
      - name: Confirm committed lockfiles were preserved
        run: git diff --exit-code -- bun.lock Cargo.lock MODULE.bazel.lock
      # P1 deliberately does not upload or publish candidate binaries.

  source_provenance:
    name: Main source provenance
    needs: [secrets, candidate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ArkenSecAI/agent-smith'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Archive this trusted main commit only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/agent-smith-source"
          git archive --format=tar.gz --prefix=agent-smith/ --output="$RUNNER_TEMP/agent-smith-source/agent-smith-source.tar.gz" "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/agent-smith-source/agent-smith-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-smith-source-${{ github.sha }}
          path: ${{ runner.temp }}/agent-smith-source/agent-smith-source.tar.gz
          if-no-files-found: error
          retention-days: 7
